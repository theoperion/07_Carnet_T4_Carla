<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22252A">
<title>Carnet T4</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto+Condensed:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:wght@400;600&family=Special+Elite&display=swap" rel="stylesheet">
<script>try{var t=JSON.parse(localStorage.getItem('carnetT4.theme')||'null');if(t&&t!=='chantier')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --kraft:#EFE6D2;--paper:#FBF7EE;--paper2:#F3ECDD;--ink:#22252A;--ink2:#3A3E45;
  --yel:#F5B700;--ora:#E2571E;--red:#C2362B;--grn:#2F7A4A;--grey:#CFC5B0;
  --rule:#CDBF9F;--muted:#6E6556;--light:#B9B2A3;
  --enc:#22252A;--card:#fff;--okbg:var(--okbg);--dots:rgba(110,101,86,.07);
  --t:'Oswald',Impact,sans-serif;--b:'Roboto Condensed',Arial Narrow,sans-serif;--m:'Roboto Mono',ui-monospace,monospace;
  --safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px);
  --stripe:repeating-linear-gradient(-45deg,var(--yel) 0 9px,var(--enc) 9px 18px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--kraft);color:var(--ink);font-family:var(--b);font-size:15px;line-height:1.4}
body{background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:4px 4px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
a.go,a.mini{text-decoration:none}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:calc(92px + var(--safeB))}

/* ---------- en-tête ---------- */
header{position:sticky;top:0;z-index:20;background:var(--enc);color:#fff;padding:calc(10px + var(--safeT)) 16px 0}
.hrow{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.htitle{flex:1;min-width:0}
.htitle h1{margin:0;font-family:var(--t);font-weight:700;font-size:22px;letter-spacing:1px;line-height:1.1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle p{margin:2px 0 0;color:var(--yel);font-style:italic;font-size:12.5px}
.ibtn{width:38px;height:38px;display:grid;place-items:center;border-radius:8px;position:relative;color:#fff}
.ibtn:active{background:var(--ink2)}
.dot{position:absolute;top:8px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 0 2px var(--enc)}
.dot.sync{background:var(--yel);animation:pulse 1s infinite}.dot.off{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.stripe{height:9px;background:var(--stripe);margin:0 -16px}

main{padding:14px 14px 0}
.view{animation:fade .18s ease-out}
@keyframes fade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- titres de section ---------- */
.sec{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:22px 0 10px;border-bottom:3px solid var(--yel);padding-bottom:4px}
.sec h2{margin:0;font-family:var(--t);font-weight:700;font-size:17px;letter-spacing:.6px;text-transform:uppercase}
.sec .lnk{font-family:var(--t);font-size:12px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;padding:4px 0}
.sec:first-child{margin-top:4px}

/* ---------- tampons d'état ---------- */
.stamp{display:inline-block;font-family:var(--t);font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:3px 7px 2px;border:2px solid currentColor;border-radius:3px;transform:rotate(-2deg);white-space:nowrap;line-height:1.2}
.st-RETARD{color:#fff;background:var(--red);border-color:var(--red)}
.st-BIENTOT{color:var(--enc);background:var(--yel);border-color:var(--yel)}
.st-RAS{color:#fff;background:var(--grn);border-color:var(--grn)}
.st-PLANIF{color:var(--ink);background:var(--grey);border-color:var(--grey)}
.st-COUVERTE{color:var(--grn)}.st-EXPIREBIENTOT{color:#9A6B00}.st-EXPIREE{color:var(--red)}

/* ---------- cartes chiffres ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{border-radius:4px;padding:12px 12px 10px;text-align:left;position:relative;overflow:hidden;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.kpi .lab{font-family:var(--t);font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.92}
.kpi .val{font-family:var(--t);font-weight:700;font-size:40px;line-height:1}
.kpi .sub{font-size:11.5px;font-style:italic;opacity:.85}
.k-red{background:var(--red);color:#fff}.k-yel{background:var(--yel);color:var(--enc)}.k-grn{background:var(--grn);color:#fff}.k-grey{background:var(--grey);color:var(--ink)}
.kpi:active{filter:brightness(.94)}
.inkcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ink{background:var(--enc);color:#fff;border-radius:4px;padding:12px}
.ink .lab{font-family:var(--t);font-size:12px;letter-spacing:1px;color:var(--yel);text-transform:uppercase}
.ink .val{font-family:var(--t);font-weight:700;font-size:28px;line-height:1.15}
.ink .sub{font-size:11.5px;font-style:italic;color:var(--light)}
.wide{grid-column:1/-1}
.gauge{height:9px;background:#3A3E45;border-radius:2px;margin:8px 0 6px;overflow:hidden;position:relative}
.gauge>i{display:block;height:100%;background:var(--yel)}
.gauge.light{background:var(--paper2)}
.gauge.light>i{background:var(--grn)}

/* ---------- listes ---------- */
.list{background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.item{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px dashed var(--rule);position:relative}
.item:last-child{border-bottom:0}
.item.tap:active{background:var(--paper2)}
.item .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.item .grow{flex:1;min-width:0}
.ttl{font-weight:700;font-size:15px;line-height:1.25}
.desc{color:var(--muted);font-size:13px;line-height:1.3;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.when{font-family:var(--m);font-size:12px;text-align:right;white-space:nowrap}
.when b{display:block;font-size:13px;color:var(--ink)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-style:italic}
.rowline{display:flex;align-items:center;gap:10px}

/* ---------- puces ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;margin:0;padding:2px 0 6px;overflow:visible}
.chip{flex:none;font-family:var(--t);font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:20px;padding:5px 11px 4px;background:var(--paper);white-space:nowrap}
.chip.on{background:var(--enc);color:var(--yel)}
.chip small{font-family:var(--m);font-size:10.5px;opacity:.7;margin-left:3px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap;line-height:1.35}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;padding:1px 6px;border:1px solid var(--rule);border-radius:3px;background:var(--paper2);white-space:nowrap}
.badge.warn{border-color:var(--ora);color:var(--ora);background:transparent}
.badge.maif{border-color:var(--ink);background:var(--yel);color:var(--enc);font-weight:700}
.go.maifon{background:var(--yel);color:var(--enc);border:2px solid var(--ink)}
.badge.star{border-color:var(--grn);color:var(--grn);font-weight:700;background:var(--okbg)}

/* ---------- boutons ---------- */
.fait{flex:none;font-family:var(--t);font-weight:500;letter-spacing:1px;font-size:13px;background:var(--enc);color:var(--yel);padding:9px 11px 8px;border-radius:4px;display:flex;align-items:center;gap:5px}
.fait:active{transform:scale(.96)}
.fait .i{width:16px;height:16px;stroke-width:2.6}
.go{display:block;width:100%;font-family:var(--t);font-weight:700;font-size:16px;letter-spacing:1.5px;text-transform:uppercase;background:var(--enc);color:var(--yel);padding:14px;border-radius:4px;text-align:center;margin-top:12px}
.go:active{transform:scale(.985)}
.go.sec2{background:var(--paper);color:var(--ink);border:2px solid var(--ink)}
.go.danger{background:transparent;color:var(--red);border:2px solid var(--red)}
.go.armed{background:var(--red);color:#fff}
.go[disabled]{opacity:.5}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnrow .go{margin-top:8px;font-size:14px;padding:12px 8px}
.mini{font-family:var(--t);font-size:12px;letter-spacing:.8px;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:4px;padding:6px 10px 5px;background:var(--paper);display:inline-flex;align-items:center;gap:6px}
.mini .i{width:16px;height:16px}
.expbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:10px 12px;margin:0 0 12px;box-shadow:3px 3px 0 var(--ink)}
.expbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.expbtn .ic{flex:none;width:38px;height:38px;border-radius:4px;background:var(--yel);display:grid;place-items:center;font-size:20px}
.expbtn b{display:block;font-family:var(--t);font-size:15px;letter-spacing:.8px;text-transform:uppercase}
.expbtn small{color:var(--muted);font-size:12.5px}
.expbtn .chev{margin-left:auto;font-size:22px;color:var(--muted)}
.prog{background:var(--enc);color:#fff;border-radius:4px;padding:14px;margin-top:12px}
.prog .lab{font-family:var(--t);font-size:12px;letter-spacing:1px;color:var(--yel);text-transform:uppercase}
.prog .et{font-family:var(--m);font-size:13px;margin-top:4px}
.prog .gauge>i{transition:width .6s}
.prog .stop{display:block;width:100%;margin-top:12px;padding:9px;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:4px;color:#fff;font-family:var(--t);font-size:12.5px;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.prog .stop.conf{background:var(--red);border-color:var(--red)}
.prog .stop:disabled{opacity:.5}
.prog .gauge.run>i{background-image:repeating-linear-gradient(-45deg,var(--yel) 0 8px,#d9a200 8px 16px);background-size:23px 23px;animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:23px 0}}
.prog .sub{font-size:11.5px;font-style:italic;color:var(--light)}
.okbox{border:2px solid var(--grn);border-radius:4px;padding:12px;margin-top:12px;background:var(--okbg)}
.okbox h4{margin:0 0 4px;font-family:var(--t);letter-spacing:1px;text-transform:uppercase;color:var(--grn)}
.warnlist{font-size:12.5px;color:var(--muted);margin:8px 0 0;padding-left:18px}
.errbox{border:2px solid var(--red);color:var(--red);border-radius:4px;padding:10px 12px;margin-top:12px;font-size:13.5px}

/* ---------- recherche / segments ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;padding:8px 10px;margin-bottom:10px}
.search input{border:0;background:none;outline:0;flex:1;font-size:15px;min-width:0}
.seg{display:flex;background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;font-family:var(--t);font-size:12px;letter-spacing:.6px;padding:8px 2px 7px;text-transform:uppercase;border-right:1.5px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--enc);color:var(--yel)}
.seg small{font-family:var(--m);font-size:10px;display:block;opacity:.75}

/* ---------- zones (jauges) ---------- */
.zline{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px dashed var(--rule)}
.zline:last-child{border-bottom:0}
.zline .zn{flex:1;font-weight:700;font-size:14px}
.zline .gg{font-family:var(--m);letter-spacing:-1px;font-size:14px;color:var(--grn)}
.zline .gg.bad{color:var(--ora)}
.zline .pc{font-family:var(--m);font-size:12px;width:38px;text-align:right}

/* ---------- barre du bas ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--enc);padding:6px 6px calc(8px + var(--safeB));display:flex;justify-content:space-around;align-items:flex-end;max-width:520px;margin:0 auto;border-top:4px solid var(--yel)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--light);font-family:var(--t);font-size:10px;letter-spacing:.4px;padding:4px 0}
.tab.on{color:var(--yel)}
.plus{flex:none;width:58px;height:58px;border-radius:50%;background:var(--yel);color:var(--enc);display:grid;place-items:center;margin:-26px 6px 2px;box-shadow:0 0 0 5px var(--enc),0 4px 10px rgba(0,0,0,.35)}
.plus .i{width:28px;height:28px;stroke-width:2.4}
.plus:active{transform:scale(.94)}

/* ---------- feuilles (bottom sheet) ---------- */
.veil{position:fixed;inset:0;background:rgba(34,37,42,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--paper);border-radius:12px 12px 0 0;max-height:92dvh;overflow:auto;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:0 16px calc(18px + var(--safeB))}
.sheet.on{transform:none}
.shead{position:sticky;top:0;background:var(--paper);padding:10px 0 10px;z-index:2;display:flex;align-items:flex-start;gap:8px;border-bottom:3px solid var(--yel);margin-bottom:12px}
.shead .grab{position:absolute;top:5px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--rule)}
.shead h3{flex:1;margin:10px 0 0;font-family:var(--t);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.5px;line-height:1.15}
.shead .ibtn{color:var(--ink);margin-top:4px}
.lbl{font-family:var(--t);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.field{width:100%;background:var(--card);border:1.5px solid var(--rule);border-radius:4px;padding:10px;font-size:15px;outline:0}
.field:focus{border-color:var(--ink)}
textarea.field{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--card)}
.kv>div{padding:8px 10px;border-bottom:1px dashed var(--rule);font-size:14px}
.kv>div:nth-child(odd){font-family:var(--t);font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);background:var(--paper2)}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.note{background:var(--paper2);border-left:4px solid var(--yel);padding:10px 12px;font-size:13.5px;margin-top:12px;border-radius:0 4px 4px 0}
.stepper{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;width:max-content;background:var(--card)}
.stepper button{width:42px;height:40px;font-size:20px;font-weight:700}
.stepper span{min-width:70px;text-align:center;font-family:var(--m);font-weight:600}
.pick{max-height:52dvh;overflow:auto;border:1px solid var(--rule);border-radius:4px;background:var(--card)}
.pick .grp{position:sticky;top:0;background:var(--paper2);font-family:var(--t);font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:6px 10px;border-bottom:1px solid var(--rule)}
.pick button{display:flex;width:100%;text-align:left;gap:8px;align-items:center;padding:10px;border-bottom:1px dashed var(--rule)}
.pick button:active{background:var(--paper2)}

/* ---------- divers ---------- */
.toast{position:fixed;left:50%;bottom:calc(98px + var(--safeB));transform:translate(-50%,20px);width:max-content;min-width:min(300px,92vw);background:var(--enc);color:#fff;padding:10px 14px;border-radius:4px;z-index:60;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:all .2s;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.3);border-left:5px solid var(--yel)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--yel);font-family:var(--t);letter-spacing:1px;font-size:13px}
#lock{position:fixed;inset:0;z-index:80;background:var(--kraft);display:grid;place-items:center;padding:24px}
#lock[hidden]{display:none}
#lock .in{width:100%;max-width:340px;text-align:center}
#lock img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#lock h1{font-family:var(--t);font-weight:700;font-size:26px;letter-spacing:1.5px;margin:18px 0 2px;text-transform:uppercase}
#lock .field{text-align:center;margin-top:10px;font-family:var(--m)}
.err{color:var(--red);min-height:20px;margin-top:8px;font-size:13.5px}
.pending{opacity:.6}
.photo-busy{display:flex;align-items:center;gap:10px;padding:10px;background:var(--paper2);border-radius:4px;margin-top:10px;font-size:13.5px}
.galerie{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:0 0 12px}
.galerie a,.galerie .ph{display:block;position:relative;aspect-ratio:3/4;border-radius:4px;overflow:hidden;background:var(--paper2);border:1px solid var(--rule)}
.galerie img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .25s ease}
.galerie.un{grid-template-columns:1fr}.galerie.un a,.galerie.un .ph{aspect-ratio:4/3}.galerie.un img{object-fit:contain}
.galerie .ph{animation:pulse 1.2s ease-in-out infinite}
.galerie .gplus{display:flex;align-items:center;justify-content:center;font-family:var(--m);font-size:22px;font-weight:700;color:var(--ink);text-decoration:none}
.galerie-msg{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
.spin{width:18px;height:18px;border:3px solid var(--rule);border-top-color:var(--ink);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.month{font-family:var(--t);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:16px 2px 6px;display:flex;justify-content:space-between}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin:22px 0 4px;font-style:italic}

/* ================= THÈMES (débloqués par les trophées) ================= */
html[data-theme="nuit"]{--kraft:#14161A;--paper:#1E2126;--paper2:#262A31;--ink:#E9E3D6;--ink2:#2A2F37;--enc:#0A0B0D;--yel:#F5B700;--ora:#F07A3A;--red:#E0533F;--grn:#3FA266;--grey:#3A3F48;--rule:#3A3F48;--muted:#A49C8D;--light:#7C766B;--card:#171A1E;--okbg:rgba(63,162,102,.2);--dots:rgba(255,255,255,.035)}
html[data-theme="atelier"]{--kraft:#E7D7BA;--paper:#FBF5EA;--paper2:#F1E5CF;--ink:#2E2016;--ink2:#5A4130;--enc:#3E2B1D;--yel:#E3A33B;--ora:#C8642B;--red:#A8402B;--grn:#5E7E3A;--grey:#CDBB9C;--rule:#C9AF86;--muted:#7B6650;--light:#C2AB8C;--card:#FFFDF8;--okbg:#E4ECD6;
  --stripe:repeating-linear-gradient(90deg,#5B3E28 0 4px,#6E4C31 4px 9px,#4E3422 9px 12px,#8A6140 12px 15px,#6E4C31 15px 22px)}
html[data-theme="recif"]{--kraft:#D7EEF0;--paper:#F3FBFB;--paper2:#E1F2F2;--ink:#0D2F3A;--ink2:#1A4554;--enc:#0B3442;--yel:#3FD0C9;--ora:#FF8A5B;--red:#E5484D;--grn:#1F9D8A;--grey:#BFD9DB;--rule:#A9CFD2;--muted:#4D7480;--light:#8FC3CA;--card:#FFFFFF;--okbg:#D5F0EA;
  --stripe:radial-gradient(circle at 7px 0,#0B3442 6.5px,#3FD0C9 7.5px) 0 0/14px 9px repeat-x}

/* ================= TROPHÉES, AQUARIUM, PELLICULE ================= */
.motiv{display:block;width:100%;text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink);overflow:hidden;margin:0 0 4px}

.aq{display:block;width:100%;height:auto}
.aq .nage{animation:nage var(--d,14s) ease-in-out infinite;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center}

.aq .algue{animation:algue 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}
@keyframes algue{from{transform:skewX(-5deg)}to{transform:skewX(6deg)}}

.mrow{display:grid;grid-template-columns:1fr 1.3fr 1fr;border-top:2px solid var(--ink)}
.mrow>div{padding:8px 10px 9px;border-right:1px dashed var(--rule)}.mrow>div:last-child{border-right:0}
.mrow .l{font-family:var(--t);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.mrow .v{font-family:var(--t);font-size:19px;font-weight:700;line-height:1.15}
.mrow .gauge{margin-top:5px;background:var(--paper2)}
.alerte{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--ora);background:var(--paper);border-radius:4px;padding:9px 11px;margin:0 0 12px;font-size:13.5px}
.alerte b{font-family:var(--t);letter-spacing:.5px;text-transform:uppercase;font-size:12.5px;color:var(--ora)}
.alerte.rouge{border-color:var(--red)}.alerte.rouge b{color:var(--red)}

.pellicule{background:#111;border-radius:3px;padding:9px 6px;display:flex;gap:5px;overflow-x:auto;position:relative;scrollbar-width:none;
  background-image:repeating-linear-gradient(90deg,#E8DFC8 0 6px,transparent 6px 14px),repeating-linear-gradient(90deg,#E8DFC8 0 6px,transparent 6px 14px);
  background-size:100% 4px,100% 4px;background-position:0 2px,0 calc(100% - 2px);background-repeat:no-repeat}
.pellicule::-webkit-scrollbar{display:none}
.frame{flex:none;width:52px;height:60px;background:#2A2A2A;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#CFC6B0;font-family:var(--t)}
.frame .m{font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.frame .s{font-size:17px;font-weight:700;line-height:1.2}
.frame.ok{background:linear-gradient(160deg,#F5B700,#C98C00);color:#22252A}
.frame.ko{background:#3A2A2A;color:#E8A08F}
.frame.vide{opacity:.35}
.frame.cours{outline:2px dashed #F5B700;outline-offset:-3px}

.tickets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ticket{position:relative;border:2px solid var(--ink);border-radius:4px;padding:9px 10px 8px;background:var(--paper);min-height:96px;
  -webkit-mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket .ic{font-size:22px;line-height:1}
.ticket .n{font-family:var(--t);font-weight:700;font-size:13.5px;letter-spacing:.4px;text-transform:uppercase;line-height:1.15;margin-top:4px}
.ticket .d{font-size:11.5px;color:var(--muted);line-height:1.25;margin-top:2px}
.ticket .r{font-family:var(--m);font-size:10px;margin-top:5px;color:var(--muted)}
.ticket .gauge{height:5px;margin-top:5px;background:var(--paper2)}
.ticket.ok{background:var(--yel);border-color:var(--enc);color:var(--enc)}
.ticket.ok .d,.ticket.ok .r{color:var(--enc);opacity:.75}
.ticket.lock{opacity:.78}.ticket.lock .ic{filter:grayscale(1);opacity:.55}
.ticket .adm{position:absolute;top:7px;right:9px;font-family:var(--m);font-size:8.5px;letter-spacing:1px;opacity:.6}

.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th{border:2px solid var(--ink);border-radius:4px;overflow:hidden;text-align:left;background:var(--paper);display:block;width:100%}
.th .sw{display:flex;height:34px}.th .sw i{flex:1}
.th .sw i:first-child{flex:2}
.th .bd{height:6px}
.th .nm{font-family:var(--t);font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase;padding:6px 8px 0}
.th .cd{font-size:11px;color:var(--muted);padding:0 8px 7px;line-height:1.25}
.th.on{outline:3px solid var(--yel);outline-offset:2px}
.th.lock .sw,.th.lock .bd{filter:grayscale(1) opacity(.45)}

.conso .mini.on{background:var(--yel);color:var(--enc);border-color:var(--enc)}
.vacline{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px dashed var(--rule);border-radius:4px;padding:8px 10px;margin-top:6px;font-size:13.5px}
/* ================= À L'AFFICHE ================= */
.affiche{border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--paper);box-shadow:3px 3px 0 var(--ink);margin:0 0 12px}
.marquee{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--enc);color:var(--yel);font-family:var(--t);font-weight:700;font-size:13px;letter-spacing:2.5px;padding:7px 10px 6px;
  border-bottom:4px dotted var(--yel);text-shadow:0 0 6px rgba(245,183,0,.55)}
.marquee .nav{display:flex;align-items:center;gap:4px;letter-spacing:1px;font-size:12px;text-shadow:none}
.marquee .nav button{color:var(--yel);font-size:20px;line-height:1;width:28px;height:24px;border-radius:3px}
.marquee .nav button:active{background:rgba(255,255,255,.12)}
.affiche .ecran{background:#111;line-height:0}

.aff-info{display:flex;align-items:center;gap:10px;padding:9px 11px 10px}
.aff-info .ttl{font-family:var(--t);font-weight:700;font-size:16px;letter-spacing:.3px;line-height:1.15;margin-top:5px}
.aff-info .desc{font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.aff-info .stamp{font-size:10px}
.sc .tourne{animation:tourne var(--d,1.2s) linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes tourne{to{transform:rotate(360deg)}}
.sc .vapeur{animation:vapeur 2.4s ease-out infinite;animation-delay:var(--dl,0s)}
@keyframes vapeur{0%{transform:translateY(6px);opacity:0}30%{opacity:.9}100%{transform:translateY(-14px);opacity:0}}
.sc .goutte{animation:goutte 1.1s linear infinite;animation-delay:var(--dl,0s)}
@keyframes goutte{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(64px);opacity:.2}}
.sc .clign{animation:clign 1.1s steps(1) infinite}
@keyframes clign{50%{opacity:.15}}
.sc.retard .clign{animation-duration:.5s}
.sc .flotte{animation:flotte 3.4s ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes flotte{to{transform:translate(10px,-8px)}}
.sc .vent{animation:vent 2s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes vent{0%{transform:translateX(-8px);opacity:0}40%{opacity:1}100%{transform:translateX(16px);opacity:0}}
.sc .onde{animation:onde 1.2s ease-out infinite;animation-delay:var(--dl,0s)}
@keyframes onde{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.sc .nuage{animation:nuage 9s ease-in-out infinite alternate}
@keyframes nuage{to{transform:translateX(40px)}}
.sc .tombe{animation:tombe 4.5s linear infinite;animation-delay:var(--dl,0s);transform-box:fill-box}
@keyframes tombe{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-30px,118px) rotate(320deg)}}
.sc .roule{animation:roule 7s ease-in-out infinite alternate}
@keyframes roule{to{transform:translateX(150px)}}
.sc .faisceau{animation:faisceau 2.6s ease-in-out infinite alternate}
@keyframes faisceau{to{opacity:.55}}
.sc .bulle{animation:bulle 3.2s linear infinite;animation-delay:var(--dl,0s)}
.sc .flash{animation:flash 2.2s steps(1) infinite}
@keyframes flash{0%,8%{opacity:1}9%,100%{opacity:.15}}
.ticket{cursor:pointer}
.aidebtn{display:inline-flex;align-items:center;gap:6px;font-family:var(--t);font-size:12px;letter-spacing:.8px;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:20px;padding:5px 11px 4px;background:var(--paper);margin:0 0 6px}

</style>
</head>

};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  return isoOf(new Date(y, mo, Math.min(d.getDate(), last)));
}
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const fr = s => { const d = dOf(s); return d ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() : '—'; };

const ETATS = { 'EN RETARD': ['RETARD', 'var(--red)'], 'BIENTÔT': ['BIENTOT', 'var(--yel)'], 'RAS': ['RAS', 'var(--grn)'], 'À PLANIFIER': ['PLANIF', 'var(--grey)'] };
const stamp = e => e ? `<span class="stamp st-${(ETATS[e] || ['PLANIF'])[0]}">${esc(e)}</span>` : '';
const gStamp = s => s ? `<span class="stamp st-${s.replace(/[\sÉÔ]/g, m => m === ' ' ? '' : m === 'É' ? 'E' : 'O')}">${esc(s)}</span>` : '';

/* ================= ÉTAT ================= */
const S = {
  d: null, key: LS.get('key', ''), url: LS.get('url', ''), queue: LS.get('queue', []),
  tab: LS.get('tab', 'bord'), fEt: 'TOUT', fZone: null, vue: 'urgence',
  hZone: null, iq: '', iPiece: null, iFiltre: null, form: null, busy: false, lastFetch: 0
};
(function () { const c = LS.get('cache', null); if (c) S.d = c; })();
const apiUrl = () => (API_URL && !API_URL.startsWith('COLLE')) ? API_URL : S.url;
function sauver() { LS.set('cache', S.d); LS.set('queue', S.queue); }

/* ================= CALCULS ================= */
function etatDe(t) {
  if (!t.dernier) return 'À PLANIFIER';
  if (t.prochain < today()) return 'EN RETARD';
  if (t.prochain <= addDays(today(), 30)) return 'BIENTÔT';
  return 'RAS';
}
function recalc(t) { // recalcule une tâche à partir de l'historique local (comme les formules du fichier)
  const h = S.d.historique.filter(x => x.element === t.element && !x.deleted);
  t.dernier = h.reduce((m, x) => x.date > m ? x.date : m, '');
  t.prochain = t.dernier && t.freq ? edate(t.dernier, t.freq) : '';
  t.jours = t.prochain ? diffJ(t.prochain, today()) : null;
  t.etat = etatDe(t);
}
function rafraichirEtats() { if (!S.d) return; S.d.entretien.forEach(t => { t.jours = t.prochain ? diffJ(t.prochain, today()) : null; t.etat = etatDe(t); }); }
const ordreUrg = (a, b) => (a.prochain || '0000') < (b.prochain || '0000') ? -1 : (a.prochain || '0000') > (b.prochain || '0000') ? 1 : 0;
const valeurMobilier = () => S.d.inventaire.filter(x => x.categorie !== 'Travaux').reduce((s, x) => s + (Number(x.prix) || 0), 0);
const histo = () => S.d.historique.filter(x => !x.deleted);

/* ================= API ================= */
function api(action, extra) {
  const body = JSON.stringify(Object.assign({ action, key: S.key }, extra || {}));
  return fetch(apiUrl(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, redirect: 'follow' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function setSync(s) { $('#dot').className = 'dot' + (s === 'sync' ? ' sync' : s === 'off' ? ' off' : ''); }
function charger(d) {
  // conserve les passages locaux pas encore envoyés
  const loc = S.d ? S.d.historique.filter(x => x.pending && !x.row) : [];
  S.d = d; S.d.historique = d.historique.concat(loc.filter(l => !d.historique.some(h => h.row && h.element === l.element && h.date === l.date && !l.row)));
  if (loc.length) S.d.entretien.forEach(recalc);
  rafraichirEtats(); sauver();
}
async function rafraichir(force) {
  if (!S.key || !apiUrl()) return;
  if (S.queue.length) return pomper();
  if (!force && Date.now() - S.lastFetch < 20000) return;
  S.lastFetch = Date.now(); setSync('sync');
  try {
    const r = await api('data');
    if (!r.ok) { if (r.error === 'CLE' || r.error === 'SANS_CLE') return verrouiller(r.message); throw new Error(r.message); }
    if (S.queue.length) return;
    charger(r.data); setSync('ok'); rendre(true);
  } catch (e) { setSync('off'); }
}

/* file d'écritures : l'écran se met à jour tout de suite, l'envoi suit */
function enfiler(op) { S.queue.push(op); sauver(); pomper(); }
async function pomper() {
  if (S.busy) return;
  const op = S.queue[0];
  if (!op) { setSync('ok'); setTimeout(() => rafraichir(true), 1200); return; }
  S.busy = true; setSync('sync');
  let res;
  try {
    if (op.op === 'fait') {
      const h = op.h || S.d.historique.find(x => x.id === op.id);
      if (!h || h.deleted) res = { ok: true, skip: true };
      else {
        res = await api('fait', { element: h.element, date: h.date, duree: h.duree });
        if (res.ok) {
          h.row = res.row; h.pending = false; h.srv = { date: h.date, element: h.element };
          // annulé pendant l'envoi : on retire la ligne qui vient d'être écrite
          if (h.deleted) { S.queue.push({ op: 'annuler', row: res.row, attendu: h.srv }); delete res.tache; }
        }
      }
    } else if (op.op === 'annuler') {
      res = await api('fait-annuler', { row: op.row, attendu: op.attendu });
    } else if (op.op === 'maj') {
      const h = S.d.historique.find(x => x.id === op.id);
      if (!h || !h.row) res = { ok: true };
      else { res = await api('passage-maj', { row: h.row, attendu: h.srv, date: h.date, duree: h.duree }); if (res.ok) { h.srv = { date: h.date, element: h.element }; h.pending = false; } }
    } else {
      res = await api(op.action, op.payload);
      if (res.ok && op.after) apresAppel(op, res);
    }
  } catch (e) { S.busy = false; setSync('off'); setTimeout(pomper, 8000); return; }
  S.queue.shift(); S.busy = false;
  if (!res.ok && op.facultatif && res.error === 'ACTION') res = { ok: true };   // script pas encore à jour : sans gravité
  if (!res.ok) {
    if (res.error === 'CLE') { sauver(); return verrouiller(res.message); }
    toast('Pas enregistré dans le fichier : ' + (res.message || 'erreur'));
    S.queue = []; sauver(); S.lastFetch = 0; rafraichir(true); return;
  }
  if (res.tache) { const t = S.d.entretien.find(x => x.element === res.tache.element); if (t && !S.queue.some(o => o.op === 'fait' || o.op === 'maj')) Object.assign(t, res.tache); }
  sauver(); rendre(true); pomper();
}
function apresAppel(op, res) {
  if (op.after === 'bien') {
    const b = S.d.inventaire.find(x => x.id === op.id);
    if (b && res.bien) Object.assign(b, res.bien, { pending: false });
  }
  if (op.after === 'jeu') { const j = (S.d.jeux || []).find(x => x.row === op.row); if (j) j.pending = false; }
  if (op.after === 'conso') { const c = (S.d.consommables || []).find(x => x.id === op.id); if (c) { c.row = res.row; c.pending = false; } }
  if (op.after === 'contact') { const c = S.d.contacts.find(x => x.id === op.id); if (c) { c.row = res.row; c.pending = false; } }
}

/* ================= RENDU ================= */
function rendre(silencieux) {
  if (!S.d) { $('#main').innerHTML = '<div class="empty">Chargement du carnet…</div>'; return; }
  rafraichirEtats();
  if (!['bord', 'entretien', 'histo'].includes(S.tab)) S.tab = 'bord';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.act === 'tab:' + S.tab));
  const T = { bord: ['Carnet · T4', 'Point du ' + frLong(today())], entretien: ['Entretien', 'Une tâche faite ? Appuie sur FAIT.'], histo: ['Historique', 'Tous les passages notés'] }[S.tab];
  $('#htitle').textContent = T[0]; $('#hsub').textContent = T[1];
  const y = scrollY;
  $('#main').innerHTML = `<div class="view">${({ bord: vBord, entretien: vEntretien, histo: vHisto })[S.tab]()}</div>`;
  if (silencieux) scrollTo(0, y);
  if (!silencieux) LS.set('tab', S.tab);
  clearTimeout(S.trT); S.trT = setTimeout(verifierTrophees, 600);
}

/* ---------- BORD ---------- */
function vBord() {
  const E = S.d.entretien, n = e => E.filter(t => t.etat === e).length;
  const ret = n('EN RETARD'), bt = n('BIENTÔT'), ras = n('RAS'), pl = n('À PLANIFIER');
  const ajour = E.length ? Math.round(100 * (E.length - ret) / E.length) : 100;
  const H = histo(), m0 = today().slice(0, 7), an = addDays(today(), -365);
  const ceMois = H.filter(h => h.date.slice(0, 7) === m0).length, sur12 = H.filter(h => h.date > an).length;
  let h = carteAffiche() + carteMotivation() + `<div class="sec"><h2>Où en est le carnet</h2></div>
  <div class="kpis">
    <button class="kpi k-red" data-act="etat" data-e="EN RETARD"><span class="lab">En retard</span><span class="val">${ret}</span><span class="sub">à faire maintenant</span></button>
    <button class="kpi k-yel" data-act="etat" data-e="BIENTÔT"><span class="lab">Sous 30 jours</span><span class="val">${bt}</span><span class="sub">à caler dans l'agenda</span></button>
    <button class="kpi k-grn" data-act="etat" data-e="RAS"><span class="lab">RAS</span><span class="val">${ras}</span><span class="sub">rien à signaler</span></button>
    <button class="kpi k-grey" data-act="etat" data-e="À PLANIFIER"><span class="lab">Jamais faites</span><span class="val">${pl}</span><span class="sub">à planifier une 1re fois</span></button>
  </div>
  <div class="inkcards">
    <div class="ink"><div class="lab">Carnet à jour</div><div class="val">${ajour} %</div><div class="gauge"><i style="width:${ajour}%"></i></div><div class="sub">des tâches sans retard</div></div>
    <div class="ink"><div class="lab">Passages</div><div class="val">${ceMois} <span style="font-size:15px;font-weight:400">ce mois</span></div><div class="sub">${sur12} sur les 12 derniers mois</div></div>
  </div>`;
  const prochains = E.filter(t => t.prochain).sort(ordreUrg).slice(0, 6);
  h += `<div class="sec"><h2>Prochains passages</h2><button class="lnk" data-act="tab:entretien">Tout voir ›</button></div><div class="list">`;
  h += prochains.map(t => ligneTache(t, true)).join('') || '<div class="empty">Rien de prévu</div>';
  h += '</div>';
  // zones
  const zones = [...new Set(E.map(t => t.zone))];
  h += `<div class="sec"><h2>État par zone</h2></div><div class="list">` + zones.map(z => {
    const tz = E.filter(t => t.zone === z), ok = tz.filter(t => t.etat !== 'EN RETARD').length, p = Math.round(100 * ok / tz.length), on = Math.round(p / 10);
    return `<button class="zline" style="width:100%;text-align:left" data-act="zone" data-z="${esc(z)}"><span class="zn">${esc(z)}</span><span class="gg ${p < 100 ? 'bad' : ''}">${'▰'.repeat(on)}${'▱'.repeat(10 - on)}</span><span class="pc">${p}%</span></button>`;
  }).join('') + '</div>';
  // contacts
  h += `<div class="sec"><h2>Contacts</h2><button class="lnk" data-act="contact-new">+ Ajouter</button></div><div class="list">` +
    (S.d.contacts.length ? S.d.contacts.map(c => `<div class="item"><div class="grow tap" data-act="contact" data-id="${c.id}"><div class="ttl">${esc(c.nom || c.pourquoi)}</div><div class="desc">${esc(c.pourquoi)}${c.notes ? ' · ' + esc(c.notes) : ''}</div></div>
      ${c.tel ? `<a class="mini" href="tel:${esc(c.tel.replace(/\s/g, ''))}">${ICON.phone}</a>` : ''}${c.mail ? `<a class="mini" href="mailto:${esc(c.mail)}">${ICON.mail}</a>` : ''}</div>`).join('') : '<div class="empty">Aucun contact</div>') + '</div>';
  h += `<div class="foot">Fichier synchronisé · ${S.d.maj ? new Date(S.d.maj).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : ''}</div>`;
  return h;
}
function ligneTache(t, compact) {
  const c = (ETATS[t.etat] || ['', 'var(--grey)'])[1];
  return `<div class="item ${t.pending ? 'pending' : ''}"><span class="bar" style="background:${c}"></span>
    <div class="grow tap" data-act="tache" data-el="${esc(t.element)}" style="padding-left:2px">
      <div class="ttl">${esc(t.element)}</div>
      ${compact ? '' : `<div class="desc">${esc(t.intervention)}</div>`}
      <div class="meta">${compact ? zoneTag(t.zone) : ''}<span class="mono">${t.prochain ? frCourt(t.prochain) : '—'}</span><span class="mono" style="color:${t.etat === 'EN RETARD' ? 'var(--red)' : 'inherit'};font-weight:${t.etat === 'EN RETARD' ? 700 : 400}">${ech(t.jours)}</span>${stamp(t.etat)}</div>
      ${!compact && t.outils ? `<div class="meta">${ICON.tool}<span>${esc(t.outils)}</span></div>` : ''}
    </div>
    <button class="fait" data-act="fait" data-el="${esc(t.element)}">${ICON.check}FAIT</button></div>`;
}

/* ---------- ENTRETIEN ---------- */
function vEntretien() {
  const E = S.d.entretien, c = e => E.filter(t => t.etat === e).length;
  const segs = [['TOUT', E.length], ['EN RETARD', c('EN RETARD')], ['BIENTÔT', c('BIENTÔT')], ['RAS', c('RAS')]];
  if (c('À PLANIFIER')) segs.push(['À PLANIFIER', c('À PLANIFIER')]);
  const C = S.d.consommables || [], CR = C.filter(c => c.racheter).length;
  let h = `<button class="expbtn" data-act="conso"><span class="ic">🧴</span><span><b>Consommables</b><small>${CR ? CR + ' à racheter · ' : ''}${C.length} article${C.length > 1 ? 's' : ''} pour l'entretien</small></span><span class="chev">›</span></button>`;
  h += `<div class="seg">${segs.map(([k, n]) => `<button class="${S.fEt === k ? 'on' : ''}" data-act="fet" data-e="${k}">${k === 'À PLANIFIER' ? 'JAMAIS' : k}<small>${n}</small></button>`).join('')}</div>`;
  const zones = [...new Set(E.map(t => t.zone))];
  h += `<div class="chips"><button class="chip ${!S.fZone ? 'on' : ''}" data-act="fzone" data-z="">Toutes</button>${zones.map(z => `<button class="chip ${S.fZone === z ? 'on' : ''}" data-act="fzone" data-z="${esc(z)}">${esc(z)}</button>`).join('')}</div>`;
  h += `<div class="rowline" style="justify-content:flex-end;margin:4px 0 8px;gap:6px"><span class="muted" style="font-size:12px">Trier :</span><button class="chip ${S.vue === 'urgence' ? 'on' : ''}" data-act="vue" data-v="urgence">Urgence</button><button class="chip ${S.vue === 'zone' ? 'on' : ''}" data-act="vue" data-v="zone">Zone</button></div>`;
  let L = E.filter(t => (S.fEt === 'TOUT' || t.etat === S.fEt) && (!S.fZone || t.zone === S.fZone));
  if (!L.length) return h + '<div class="list"><div class="empty">Aucune tâche ici 👌</div></div>';
  if (S.vue === 'zone') {
    const g = {}; L.forEach(t => (g[t.zone] = g[t.zone] || []).push(t));
    Object.keys(g).forEach(z => h += `<div class="month"><span>${esc(z)}</span><span>${g[z].length}</span></div><div class="list">${g[z].sort(ordreUrg).map(t => ligneTache(t)).join('')}</div>`);
  } else h += `<div class="list">${L.sort(ordreUrg).map(t => ligneTache(t)).join('')}</div>`;
  return h;
}

/* ---------- HISTORIQUE ---------- */
function vHisto() {
  const H = histo().slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.row || 1e9) - (a.row || 1e9));
  const m0 = today().slice(0, 7);
  const ceMois = H.filter(h => h.date.slice(0, 7) === m0), min = ceMois.reduce((s, h) => s + (Number(h.duree) || 0), 0);
  let h = `<div class="inkcards" style="margin-top:0"><div class="ink"><div class="lab">Ce mois-ci</div><div class="val">${ceMois.length}</div><div class="sub">passages · ${min ? min + ' min' : 'durée non notée'}</div></div>
    <div class="ink"><div class="lab">Sur 12 mois</div><div class="val">${H.filter(x => x.date > addDays(today(), -365)).length}</div><div class="sub">lignes dans l'historique</div></div></div>`;
  const zones = [...new Set(S.d.entretien.map(t => t.zone))];
  h += `<div class="chips" style="margin-top:12px"><button class="chip ${!S.hZone ? 'on' : ''}" data-act="hzone" data-z="">Toutes</button>${zones.map(z => `<button class="chip ${S.hZone === z ? 'on' : ''}" data-act="hzone" data-z="${esc(z)}">${esc(z)}</button>`).join('')}</div>`;
  const L = H.filter(x => !S.hZone || zoneDe(x.element) === S.hZone);
  if (!L.length) return h + '<div class="list"><div class="empty">Aucun passage noté</div></div>';
  let mois = '';
  L.forEach((x, i) => {
    const m = x.date.slice(0, 7);
    if (m !== mois) {
      if (mois) h += '</div>';
      const d = dOf(x.date), nb = L.filter(z => z.date.slice(0, 7) === m).length;
      h += `<div class="month"><span>${MOIS[d.getMonth()]} ${d.getFullYear()}</span><span>${nb} passage${nb > 1 ? 's' : ''}</span></div><div class="list">`; mois = m;
    }
    h += `<div class="item tap ${x.pending ? 'pending' : ''}" data-act="passage" data-id="${x.id}"><div class="mono" style="font-size:13px;font-weight:600;width:44px">${frCourt(x.date)}</div>
      <div class="grow"><div class="ttl">${esc(x.element)}</div><div class="meta">${zoneTag(zoneDe(x.element) || x.zone)}${x.duree ? `<span class="mono">${x.duree} min</span>` : ''}${x.pending ? '<span>envoi…</span>' : ''}</div></div></div>`;
  });
  return h + '</div>';
}
const zoneDe = el => (S.d.entretien.find(t => t.element === el) || {}).zone || '';

/* ---------- INVENTAIRE ---------- */

    <div class="gauge"><i style="width:${Math.min(pct, 100)}%;background:${pct >= 95 ? 'var(--red)' : pct >= 90 ? 'var(--ora)' : 'var(--yel)'}"></i></div><div class="sub">${I.length} biens · ${pct} % du plafond MAIF · hors travaux</div></div>`;

  const F = [['maif', '🛡 Sélection MAIF', I.filter(b => b.maif).length], ['photo', '📷 Sans photo', sansPhoto], ['prix', '€ Sans prix', sansPrix], ['couverte', '✓ Sous garantie', I.filter(sousGarantie).length], ['star', '★ Garantie +2 ans', star], ['garantie', 'Garantie à surveiller', I.filter(b => b.statut === 'EXPIRE BIENTÔT' || b.statut === 'EXPIRÉE').length]];
  h += `<div class="chips">${F.map(([k, l, n]) => `<button class="chip ${S.iFiltre === k ? 'on' : ''}" data-act="ifiltre" data-f="${k}">${l}<small>${n}</small></button>`).join('')}</div>`;
  h += `<div class="rowline" style="justify-content:space-between;margin:6px 0 8px"><span class="muted" id="icount" style="font-size:12.5px"></span><button class="mini" data-act="bien-new">${ICON.plus}Ajouter un bien</button></div>`;
  h += `<div class="list" id="ilist">${listeBiens()}</div>`;
  return h;
}
// encore sous garantie aujourd'hui (2 ans légaux ou extension), y compris celles qui expirent bientôt
const sousGarantie = b => !!b.finGarantie && b.finGarantie >= today();
function biensFiltres() {
  const q = norm(S.iq);

function validerFait() {

const galCle = b => b.row + '|' + (b.srvObjet || b.objet) + '|' + (b.photoLabel || '');
const galNb = b => Math.max(1, parseInt(String(b.photoLabel || '').replace(/\D+/g, ' ').trim(), 10) || 1);
function galerieHtml(b) {

  if (g.err) return `<div class="galerie-msg" id="galerie">${esc(g.err)}</div>`;
  if (!g.photos.length) return '';
  const reste = g.total - g.photos.length, n = g.photos.length + (reste > 0 ? 1 : 0);

    + (reste > 0 ? `<a class="gplus" href="${esc(b.photo)}" target="_blank" rel="noopener">+${reste}</a>` : '') + '</div>';
}
async function chargerGalerie(b) {
  if (!b.photo || !b.row || S.galKO) return;

    if (!r.ok) {

}

/* ---------- photo ---------- */
function compresser(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const M = 1600, r = Math.min(1, M / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = rej; img.src = url;
  });
}
// Une ou plusieurs photos (appareil photo ou galerie), envoyées l'une après l'autre
async function envoyerPhotos(files) {
  const b = S.d.inventaire.find(x => x.id === (S.form || {}).id); if (!b || !b.row || !files.length) return;
  const n = files.length; let ok = 0, nb = 0, erreur = '';
  for (let i = 0; i < n; i++) {
    const box = $('#photoBox');
    if (box) box.innerHTML = `<div class="photo-busy"><span class="spin"></span>Envoi ${n > 1 ? 'de la photo ' + (i + 1) + '/' + n : 'de la photo'} vers le Drive…</div>`;
    try {
      const data = await compresser(files[i]);
      const r = await api('photo', { row: b.row, attendu: { objet: b.srvObjet || b.objet }, image: data });
      if (!r.ok) throw new Error(r.message);
      b.photo = r.photo; b.photoLabel = r.photoLabel; nb = r.nb; ok++; sauver();
    } catch (e) { erreur = (e && e.message) || (e && e.type === 'error' ? 'format d\'image non lu' : 'connexion impossible'); if (!navigator.onLine) break; }
  }
  if (ok) toast('📷 ' + (ok > 1 ? ok + ' photos rangées' : 'Photo rangée') + ' dans le Drive (' + nb + ')');
  if (S.form && S.form.id === b.id) ouvrirBien(b.id);
  rendre(true);
  if (ok < n) { const box = $('#photoBox'); if (box) box.innerHTML = `<div class="photo-busy" style="color:var(--red)">${n - ok} photo${n - ok > 1 ? 's' : ''} non envoyée${n - ok > 1 ? 's' : ''} : ${esc(erreur)}</div>`; }
}

async function suivreExport() {
  if (S.expPoll) return; S.expPoll = true;
  try {
    while (S.form && S.form.mode === 'export') {
      let r = null;
      try { r = await api('export-statut'); } catch (e) { if (S.form) { S.form.charge = false; rendreExport(); } toast('Connexion impossible'); break; }
      if (!S.form || S.form.mode !== 'export') break;
      if (!r.ok) { S.form.charge = false; rendreExport(); if (r.error === 'ACTION') toast('Mets à jour le script (Export.gs)'); break; }
      S.expSt = S.form.st = r.statut; S.expDernier = S.form.dernier = r.dernier; S.form.charge = false; rendreExport();
      if (!r.statut || (r.statut.etat !== 'attente' && r.statut.etat !== 'en cours')) break;
      await new Promise(ok => setTimeout(ok, 4000));
    }
  } finally { S.expPoll = false; }
}
async function lancerExport() {
  const f = S.form; f.envoi = true; rendreExport();
  try {
    const r = await api('export', f.ludo ? { ludo: true } : { pieces: [...f.pieces], annexes: f.annexes, maif: f.maif });
    f.envoi = false;
    if (!r.ok && r.error !== 'EN_COURS') { toast(r.error === 'ACTION' ? 'Mets à jour le script (Export.gs)' : 'Échec : ' + r.message); rendreExport(); return; }
    S.expSt = f.st = r.statut; rendreExport(); suivreExport();
  } catch (e) { f.envoi = false; rendreExport(); toast('Connexion impossible'); }
}

// Annulation en deux touches (la 1re arme le bouton 4 s, la 2e confirme) : pas de fenêtre de confirmation
async function arreterExport() {
  const f = S.form; if (!f || f.arret) return;
  if (!f.stop) {
    f.stop = true; rendreExport(); clearTimeout(S.stopT);
    S.stopT = setTimeout(() => { if (S.form && S.form.mode === 'export' && S.form.stop) { S.form.stop = false; rendreExport(); } }, 4000);
    return;
  }
  clearTimeout(S.stopT); f.stop = false; f.arret = true; rendreExport();
  try {
    const r = await api('export-annuler');

    S.expSt = f.st = r.statut; rendreExport(); toast(r.deja ? 'L\'export était déjà terminé' : 'Export annulé');
  } catch (e) { f.arret = false; rendreExport(); toast('Connexion impossible'); }
}

const lundi = s => { const d = dOf(s); return addDays(s, -((d.getDay() + 6) % 7)); };
function datesDe(el) { const auj = today(); return [...new Set(histo().filter(h => h.element === el && h.date <= auj).map(h => h.date))].sort(); }
// périodes [debut, fin[ pendant lesquelles une tâche était en retard (au lendemain de l'échéance, jusqu'au passage suivant)
function periodesRetard() {
  const cle = today() + '|' + histo().map(h => h.date + h.element).join(',') + '|' + S.d.entretien.map(t => t.element + t.freq).join(',');
  if (S._pr && S._pr.k === cle) return S._pr.v;
  const lendemain = addDays(today(), 1), out = [];
  S.d.entretien.forEach(t => {
    if (!t.freq) return;
    const ds = datesDe(t.element);
    ds.forEach((d, i) => {
      const debut = addDays(plusFreq(d, t.freq), 1), fin = ds[i + 1] || lendemain;
      if (debut < fin) out.push({ el: t.element, debut, fin });
    });
  });
  S._pr = { k: cle, v: out };
  return out;
}
const debutCarnet = () => histo().reduce((m, h) => !m || h.date < m ? h.date : m, '');
const enVacances = j => jeu().vacances.some(v => v.debut <= j && j <= v.fin);
function joursVacances(a, b) { let n = 0; for (let d = a; d < b; d = addDays(d, 1)) if (enVacances(d)) n++; return n; }

// semaines (du lundi) depuis le début du carnet : 'ok', 'ko' ou 'vac'
function semaines() {
  const d0 = debutCarnet(); if (!d0) return [];
  const P = periodesRetard(), auj = today(), out = [];
  for (let ws = lundi(d0); ws <= auj; ws = addDays(ws, 7)) {
    const we = addDays(ws, 7);
    const etat = joursVacances(ws, we) >= 4 ? 'vac' : P.some(p => p.debut < we && p.fin > ws) ? 'ko' : 'ok';
    out.push({ ws, etat });
  }
  return out;
}
function series() {
  const W = semaines(); let cur = 0, best = 0, run = 0, debut = '', bestDebut = '', bestFin = '';
  W.forEach(w => {
    if (w.etat === 'ok') { if (!run) debut = w.ws; run++; if (run > best) { best = run; bestDebut = debut; bestFin = addDays(w.ws, 7); } }
    else if (w.etat === 'ko') run = 0;
  });
  for (let i = W.length - 1; i >= 0; i--) { if (W[i].etat === 'ok') cur++; else if (W[i].etat === 'ko') break; }
  return { cur, best, bestDebut, bestFin };
}
// mois : part des jours sans retard (jours de vacances exclus)
function mois(m) {
  const d0 = debutCarnet(), auj = today(); if (!d0) return null;
  const m1 = m + '-01', m2 = edate(m1, 1), a = m1 < d0 ? d0 : m1, b = m2 > addDays(auj, 1) ? addDays(auj, 1) : m2;
  if (a >= b) return null;
  const P = periodesRetard().filter(p => p.debut < b && p.fin > a);
  let ok = 0, n = 0;
  for (let d = a; d < b; d = addDays(d, 1)) { if (enVacances(d)) continue; n++; if (!P.some(p => p.debut <= d && d < p.fin)) ok++; }
  return { m, ok, n, pct: n ? Math.round(100 * ok / n) : 100, fini: m2 <= auj, parfait: m2 <= auj && n > 0 && ok === n };
}
function moisListe(nb) {
  const out = []; let m = today().slice(0, 7);
  for (let i = 0; i < nb; i++) { out.unshift(m); m = edate(m + '-01', -1).slice(0, 7); }
  return out;
}
// tâches du mois en cours : faites / à faire (échéance dans le mois, retards compris)
function bilanMois() {
  const m = today().slice(0, 7), fin = edate(m + '-01', 1);
  const faites = new Set(histo().filter(h => h.date.slice(0, 7) === m).map(h => h.element).filter(el => S.d.entretien.some(t => t.element === el)));
  const reste = S.d.entretien.filter(t => !faites.has(t.element) && t.prochain && t.prochain < fin).length;
  return { faites: faites.size, total: faites.size + reste };
}
// entretiens d'aquarium faits à l'heure d'affilée (les plus récents)
function suiteAquarium() {
  const T = S.d.entretien.filter(t => /aquarium/i.test(t.zone + ' ' + t.element) && t.freq), ev = [];
  T.forEach(t => { const ds = datesDe(t.element); for (let i = 1; i < ds.length; i++) ev.push({ d: ds[i], ok: ds[i] <= plusFreq(ds[i - 1], t.freq) }); });
  if (T.some(t => t.etat === 'EN RETARD')) return 0;
  ev.sort((a, b) => a.d < b.d ? -1 : 1);
  let n = 0; for (let i = ev.length - 1; i >= 0 && ev[i].ok; i--) n++;
  return n;
}

// nouveaux trophées : on les garde (synchronisés) et on fête ça
function verifierTrophees() {
  if (!S.d || !S.d.entretien) return;
  const j = jeu(), T = trophees(), neufs = T.filter(t => t.ok && !j.gagnes.includes(t.id));
  if (!neufs.length) return;
  const premiere = !LS.get('trophees-vus', false);
  j.gagnes = [...new Set(j.gagnes.concat(neufs.map(t => t.id)))];
  neufs.forEach(t => { if (!j.dates[t.id]) j.dates[t.id] = today(); });

  if (premiere && neufs.length > 1) toast('🏆 ' + neufs.length + ' trophées déjà gagnés !', 'Voir', ouvrirTrophees);
  else toast('🏆 ' + neufs[0].nom + (th ? ' · thème « ' + th.theme.nom + ' » débloqué' : ' · un ' + neufs[0].poisson[0].toLowerCase() + ' rejoint l\'aquarium'), 'Voir', ouvrirTrophees);
}

    ${bulles}

function ouvrirTrophees() {

  S.form = { mode: 'trophees' };
  const T = trophees(), sr = series(), j = jeu(), auj = today();
  const M = moisListe(12).map(m => ({ m, s: mois(m) }));

    if (!s.fini) return `<div class="frame cours"><span class="m">${nm}</span><span class="s">${s.pct}%</span></div>`;
    return `<div class="frame ${s.parfait ? 'ok' : 'ko'}"><span class="m">${nm}</span><span class="s">${s.parfait ? '★' : s.pct + '%'}</span></div>`;
  }).join('');

      <div class="r">${t.theme ? '🎨 thème ' + esc(t.theme.nom) : '🐟 ' + esc(t.poisson[0])}${t.ok ? '' : ' · ' + Math.min(a, b) + '/' + b}</div></div>`;
  };
  ouvrir(tete('Trophées', `🔥 série ${sr.cur} sem. · record ${sr.best} · 🏆 ${T.filter(t => t.ok).length}/${T.length}`) + `

    <div class="lbl" style="margin-top:16px">Thèmes de l'appli</div>

      const tr = th.tr ? T.find(t => t.id === th.tr) : null, ok = !tr || tr.ok;
      return `<button class="th ${j.theme === th.id ? 'on' : ''} ${ok ? '' : 'lock'}" data-act="theme" data-t="${th.id}">
        <div class="sw">${th.sw.map(c => `<i style="background:${c}"></i>`).join('')}</div><div class="bd" style="background:${th.bd}"></div>
        <div class="nm">${th.ic} ${esc(th.nom)}</div><div class="cd">${j.theme === th.id ? '✓ en cours · ' : ''}${!tr ? 'Thème de base' : ok ? 'Débloqué par « ' + esc(tr.nom) + ' »' : '🔒 ' + esc(tr.nom) + ' : ' + esc(tr.desc.toLowerCase())}</div></button>`;
    }).join('')}</div>
    <div class="lbl" style="margin-top:16px">Trophées</div>

    <p class="muted" style="font-size:12.5px;margin:0 2px 6px">Pendant tes absences, la série est en pause (elle ne casse pas) et le mail de rappel d'entretien ne part pas.</p>
    ${vacs.map(v => `<div class="vacline"><span>${v.debut <= auj ? '<b>En cours</b> · ' : ''}du <span class="mono">${fr(v.debut)}</span> au <span class="mono">${fr(v.fin)}</span></span><button class="mini" data-act="vac-del" data-d="${v.debut}">${v.debut <= auj ? 'Je suis rentré' : 'Retirer'}</button></div>`).join('')}
    <div class="grid2" style="margin-top:8px"><div><div class="lbl">Départ</div><input class="field mono" type="date" id="vac-d" value="${auj}"></div><div><div class="lbl">Retour</div><input class="field mono" type="date" id="vac-f" value="${addDays(auj, 7)}"></div></div>
    <div class="err" id="vac-err"></div>
    <button class="go sec2" data-act="vac-add">🏖 Ajouter ces vacances</button>`);
  const f = $('#film'); if (f) f.scrollLeft = f.scrollWidth;
}
function ajouterVacances() {
  const d = $('#vac-d').value, f = $('#vac-f').value;
  if (!d || !f || f < d) { $('#vac-err').textContent = 'Indique un départ et un retour (retour après le départ)'; return; }
  const j = jeu(); j.vacances = j.vacances.filter(v => !(v.debut <= f && d <= v.fin)).concat([{ debut: d, fin: f }]);
  sauverJeu(); ouvrirTrophees(); rendre(true); toast('🏖 Vacances notées : série en pause, pas de rappel');
}
function retirerVacances(debut) {
  const j = jeu(), auj = today();
  // en cours : on arrête hier (le passé reste en pause) ; à venir : on supprime
  j.vacances = j.vacances.map(v => v.debut === debut && v.debut <= auj ? Object.assign({}, v, { fin: addDays(auj, -1) }) : v)
    .filter(v => !(v.debut === debut && v.debut > auj) && v.debut <= v.fin);
  sauverJeu(); ouvrirTrophees(); rendre(true); toast('Bon retour 👋');
}

    <div><div class="lbl">À racheter</div><div class="chips" style="margin:0"><button class="chip ${v.racheter ? 'on' : ''}" data-act="k-rach" data-v="1">Oui</button><button class="chip ${!v.racheter ? 'on' : ''}" data-act="k-rach" data-v="0">Non</button></div></div></div>
    <div class="lbl">Lien d'achat</div><input class="field" id="k-lien" type="url" value="${esc(v.lien)}" placeholder="https://…">
    <div class="lbl">Remarque</div><input class="field" id="k-remarque" value="${esc(v.remarque)}">
    <div class="err" id="k-err"></div>
    <button class="go" data-act="k-save">Enregistrer</button>
    ${c ? `<button class="go danger" data-act="k-del" id="k-del">Supprimer</button>` : ''}`);
  S.form.racheter = !!v.racheter;
}
function enregistrerConso() {
  const f = S.form, v = {};['article', 'pour', 'lien', 'remarque'].forEach(k => v[k] = $('#k-' + k).value.trim());
  const p = $('#k-prix').value.trim(), n = Number(p.replace(/\s/g, '').replace(',', '.'));
  v.prix = p === '' || isNaN(n) ? '' : n; v.racheter = !!f.racheter;
  if (!v.article) { $('#k-err').textContent = "Le nom de l'article est obligatoire"; return; }
  if (v.lien && !/^https?:\/\//i.test(v.lien)) v.lien = 'https://' + v.lien;
  if (f.id) {
    const c = conso().find(x => x.id === f.id), att = { article: c.srv ? c.srv.article : c.article };
    Object.assign(c, v, { pending: true, srv: { article: v.article } });
    enfiler({ op: 'call', action: 'conso-save', payload: { row: c.row, attendu: att, conso: v }, after: 'conso', id: c.id });
  } else {
    const c = Object.assign({ id: uid(), pending: true, srv: { article: v.article } }, v); conso().push(c);
    enfiler({ op: 'call', action: 'conso-save', payload: { conso: v }, after: 'conso', id: c.id });
  }
  ouvrirConso(); rendre(true); toast('Consommable enregistré');
}
function supprimerConso() {
  if (!S.form.arm) { S.form.arm = true; const b = $('#k-del'); if (b) b.textContent = 'Toucher encore pour supprimer'; return; }
  const c = conso().find(x => x.id === S.form.id); if (!c) return ouvrirConso();
  S.d.consommables = conso().filter(x => x !== c);
  if (c.row) enfiler({ op: 'call', action: 'conso-del', payload: { row: c.row, attendu: c.srv || { article: c.article } } });
  ouvrirConso(); rendre(true); toast('Consommable supprimé');
}
function basculerRachat(id) {
  const c = conso().find(x => x.id === id); if (!c) return;
  c.racheter = !c.racheter;
  if (c.row) enfiler({ op: 'call', action: 'conso-racheter', payload: { row: c.row, attendu: c.srv || { article: c.article }, racheter: c.racheter } });
  ouvrirConso(); rendre(true);
}

/* ================= À L'AFFICHE : une scène animée par chose à faire ================= */
// Chaque zone du carnet et chaque partie de l'inventaire a sa scène ; l'état (en retard / bientôt / ok) change le décor.
function sceneTache(t) {
  const x = (t.zone + ' ' + t.element).toLowerCase();
  if (/aquarium/.test(x)) return 'filtreaq';
  if (/aspirateur|robot/.test(x)) return 'robot';
  if (/bouilloire|cafeti|gourde|électroménager|electromenager/.test(x)) return 'cafe';
  if (/lave-linge|sèche-linge|buanderie/.test(x)) return 'linge';
  if (/cuisine/.test(x)) return 'cuisine';
  if (/salle de bain|wc|siphon|douche/.test(x)) return 'sdb';
  if (/ventilation|vmc|clim|aldes/.test(x)) return 'vmc';
  if (/sécurité|securite|fumée/.test(x)) return 'alarme';
  if (/menuiserie|ouverture|fenêtre|volet|serrure|mur/.test(x)) return 'fenetre';
  if (/extérieur|exterieur|balcon/.test(x)) return 'balcon';
  return 'outils';
}
function aFaire() {
  const E = S.d.entretien, auj = today(), out = [];
  const tache = (t, niv) => out.push({ scene: sceneTache(t), niv, titre: t.element, sous: t.intervention, quand: ech(t.jours), act: 'fait', el: t.element, bouton: '✓ FAIT' });
  E.filter(t => t.etat === 'EN RETARD').sort(ordreUrg).forEach(t => tache(t, 'retard'));
  E.filter(t => t.etat === 'BIENTÔT' && t.jours <= 7).sort(ordreUrg).forEach(t => tache(t, 'bientot'));
  const R = (S.d.consommables || []).filter(c => c.racheter);
  if (R.length) out.push({ scene: 'courses', niv: 'bientot', titre: R.length + ' consommable' + (R.length > 1 ? 's' : '') + ' à racheter', sous: R.map(c => c.article).slice(0, 3).join(' · '), quand: '', act: 'conso', bouton: '🛒 Liste' });
  E.filter(t => t.etat === 'BIENTÔT' && t.jours > 7).sort(ordreUrg).slice(0, 3).forEach(t => tache(t, 'plus-tard'));
  if (!out.length) out.push({ scene: 'cine', niv: 'relache', titre: 'Relâche ce soir 🍿', sous: 'Tout est à jour : soirée film bien méritée', quand: '', ecran: 'RELÂCHE' });
  return out.slice(0, 8);
}

/* ---------- trophées : pourquoi, comment, quand ---------- */
function explication(t) {
  const E = S.d.entretien, H = histo(), d0 = debutCarnet(), sr = series();
  const I = S.d.inventaire.filter(b => b.categorie !== 'Travaux'), liste = (L, k) => L.slice(0, k || 4).join(', ') + (L.length > (k || 4) ? '…' : '');
  const [a, b] = t.prog;
  switch (t.id) {
    case 'chiffon': case 'rode': case 'pilier': case 'legende':
      return `Tu as noté ${a} passage${a > 1 ? 's' : ''}${d0 ? ' depuis le ' + fr(d0) : ''}.`;
    case 'ordre': { const R = E.filter(x => x.etat === 'EN RETARD'); return R.length ? `En retard en ce moment : ${liste(R.map(x => x.element))}.` : 'Aucune tâche en retard en ce moment.'; }
    case 'tour': { const R = E.filter(x => !x.dernier); return R.length ? `Jamais faites : ${liste(R.map(x => x.element))}.` : `Les ${b} tâches du carnet ont toutes été faites au moins une fois.`; }
    case 'pyro': { const p = H.filter(h => /^four\b/i.test(h.element)).map(h => h.date).sort().pop(); return p ? `Dernière pyrolyse notée le ${fr(p)}.` : 'Aucune pyrolyse notée pour l\'instant (tâche « Four »).'; }
    case 'aqua': { const R = E.filter(x => /salle de bain|wc/i.test(x.zone) && !x.dernier); return R.length ? `Jamais faites : ${liste(R.map(x => x.element))}.` : 'Toutes les tâches Salle de bain et WC ont été faites au moins une fois.'; }
    case 'cine': { const R = E.filter(x => /cuisine/i.test(x.zone) && !x.dernier); return R.length ? `Jamais faites : ${liste(R.map(x => x.element))}.` : 'Toutes les tâches Cuisine ont été faites au moins une fois.'; }
    case 'serie4': case 'serie12': case 'serie26':
      return sr.best ? `Ta meilleure série : ${sr.best} semaine${sr.best > 1 ? 's' : ''} sans retard (du ${fr(sr.bestDebut)} au ${fr(addDays(sr.bestFin, -1))}). Série actuelle : ${sr.cur}.` : 'Pas encore de semaine complète sans retard.';
    case 'mois': { const P = moisListe(24).map(mois).filter(x => x && x.parfait).map(x => MOIS[+x.m.slice(5, 7) - 1] + ' ' + x.m.slice(0, 4));
      return P.length ? `Mois parfait${P.length > 1 ? 's' : ''} : ${liste(P, 6)}.` : 'Aucun mois complet sans retard pour l\'instant (le mois en cours compte quand il sera fini).'; }
    case 'papa': { const R = I.filter(x => !x.photo); return R.length ? `${a}/${b} biens en photo. Sans photo : ${liste(R.map(x => x.objet))}.` : 'Tout l\'inventaire a sa photo.'; }
    case 'beton': { const R = I.filter(x => !(x.prix && (x.facture || x.photo))); return R.length ? `${a}/${b} biens complets. À compléter : ${liste(R.map(x => x.objet))}.` : 'Chaque bien a un prix et une facture ou une photo.'; }
    case 'ludo': { const R = (S.d.jeux || []).filter(j => j.assure && !j.valeur); return (S.d.jeux || []).length ? (R.length ? `Sans valeur : ${liste(R.map(j => j.titre))}.` : 'Tous les jeux assurés ont une valeur.') : 'Ludothèque vide pour l\'instant.'; }
    case 'conso': { const R = (S.d.consommables || []).filter(c => !(c.prix && c.lien)); return R.length ? `Sans prix ou sans lien : ${liste(R.map(c => c.article))}.` : 'Chaque consommable a un prix et un lien d\'achat.'; }
    case 'annee': return d0 ? `Premier passage noté le ${fr(d0)} (il y a ${diffJ(today(), d0)} jours).` : 'Aucun passage noté.';
  }
  return '';
}
function ouvrirTrophee(id) {

function verrouiller(msg) {
  const l = $('#lock'); l.hidden = false;
  const besoinUrl = !API_URL || API_URL.startsWith('COLLE');
  l.innerHTML = `<div class="in"><img src="icon-192.png" alt=""><h1>Carnet · T4</h1>
    <p class="muted" style="margin:0 0 18px;font-style:italic">Carnet d'entretien de l'appartement</p>
    ${besoinUrl ? `<input class="field" id="kurl" placeholder="URL de l'API (…/exec)" value="${esc(S.url || '')}" autocomplete="off">` : ''}
    <input class="field" id="kin" type="password" placeholder="Clé d'accès" autocomplete="current-password">
    <div class="err" id="kerr">${msg ? esc(msg) : ''}</div>
    <button class="go" id="kgo">Ouvrir le carnet</button></div>`;
  const go = $('#kgo');
  const valider = async () => {
    const v = $('#kin').value.trim(), u = $('#kurl') ? $('#kurl').value.trim() : '';
    if ($('#kurl') && !/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) { $('#kerr').textContent = "Colle l'URL du déploiement Apps Script (elle finit par /exec)"; return; }
    if (!v) { $('#kerr').textContent = 'Tape ta clé'; return; }
    go.textContent = 'Vérification…'; S.key = v; if (u) S.url = u;
    try {
      const r = await api('data');
      if (!r.ok) { go.textContent = 'Ouvrir le carnet'; $('#kerr').textContent = r.message || 'Clé incorrecte'; return; }
      LS.set('key', v); if (u) LS.set('url', u); S.queue = []; S.d = null; charger(r.data);
      l.hidden = true; S.lastFetch = Date.now(); setSync('ok'); rendre();
    } catch (e) { go.textContent = 'Ouvrir le carnet'; $('#kerr').textContent = 'Connexion impossible. Vérifie l\'URL et ta connexion.'; }
  };
  go.addEventListener('click', valider);
  $('#kin').addEventListener('keydown', e => { if (e.key === 'Enter') valider(); });
}
